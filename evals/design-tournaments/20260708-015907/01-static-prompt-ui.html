<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Static Prompt UI</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main, section, article, nav, header, footer { display: block; }
    img { max-width: 100%; height: auto; }
    button { cursor: pointer; }
  </style>
</head>
<body>
<main style='padding:40px;text-align:center'><h1>Generate UI</h1><p style='color:#666'>Describe what you need.</p><button style='padding:12px 24px'>Generate</button></main>
</body>
</html>
